[project]
name = "codex-ecommerce-demo"
version = "0.1.0"
description = "Ecommerce demo services and ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
